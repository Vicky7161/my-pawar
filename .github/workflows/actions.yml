name: my-action
on: workflow_dispatch
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: first-step
        run: echo "Hello this is the first step"
  second-job:
    needs: first-job
    runs-on: ubuntu-latest
    steps:
      - name: second-step
        run: echo "Hello this is the second step"
